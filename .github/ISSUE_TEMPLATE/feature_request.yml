---
name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature for Aether OS.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: I'm trying to... but currently...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've considered.

  - type: dropdown
    id: milestone
    attributes:
      label: Target Milestone
      options:
        - M1 — Boot & Kernel
        - M2 — Memory Management
        - M3 — Scheduler
        - M4 — Syscalls
        - M5 — Filesystem
        - M6 — User Space
        - Post-M6

  - type: checkboxes
    id: adr
    attributes:
      label: Architecture Impact
      options:
        - label: This feature requires a new Architecture Decision Record (ADR)
          required: false
