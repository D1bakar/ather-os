---
name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in Aether OS.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `make build`
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, QEMU version (if applicable).
      placeholder: |
        - OS: Ubuntu 24.04
        - Rust: 1.85.0
        - QEMU: 8.2.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Relevant output, panic messages, or screenshots.
      render: shell

  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options:
        - M0 — Repository Foundation
        - M1 — Boot & Kernel
        - M2 — Memory Management
        - M3 — Scheduler
        - M4 — Syscalls
        - M5 — Filesystem
        - Unknown
