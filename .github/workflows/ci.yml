name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTC_BOOTSTRAP: 1

jobs:
  matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fmt
            name: fmt
            run: cargo fmt --all -- --check

          - id: clippy
            name: clippy
            run: |
              cargo clippy --workspace --exclude aether-boot --all-targets -- -D warnings
              cargo clippy -p aether-boot --target x86_64-unknown-uefi -- -D warnings

          - id: test
            name: test
            run: cargo test --workspace

          - id: uefi-build
            name: uefi build
            run: cargo build -p aether-boot --target x86_64-unknown-uefi --release

          - id: bare-metal-build
            name: bare-metal build
            run: |
              export CARGO_TARGET_X86_64_UNKNOWN_NONE_RUSTFLAGS="-Dwarnings -C link-arg=-Tkernel/linker.ld -C relocation-model=static"
              cargo build -p aether-kernel --no-default-features --features bare-metal \
                --target x86_64-unknown-none --release \
                -Z build-std=core,alloc,compiler_builtins \
                -Z build-std-features=compiler-builtins-mem

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy, rust-src, llvm-tools-preview

      - name: Add cross targets
        run: rustup target add x86_64-unknown-none x86_64-unknown-uefi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.id }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.id }}-
            ${{ runner.os }}-cargo-

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}

  qemu-boot:
    name: QEMU boot (optional)
    runs-on: ubuntu-latest
    needs: matrix
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rust-src

      - name: Add cross targets
        run: rustup target add x86_64-unknown-none x86_64-unknown-uefi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-qemu-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-qemu-
            ${{ runner.os }}-cargo-

      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf

      - name: Build boot artifacts
        run: bash scripts/build-boot.sh

      - name: Run QEMU smoke test
        env:
          TIMEOUT: 45
        run: bash scripts/run-qemu.sh

      - name: Verify ring-3 init serial output
        run: |
          grep -q "Aether OS M6: userland started" build/qemu-serial.log
          grep -q "Aether init started" build/qemu-serial.log
          if grep -q '\[timer\] tick' build/qemu-serial.log; then
            echo "Timer tick output observed"
          else
            echo "No timer ticks in log (run may have ended before 1s tick interval)"
          fi
