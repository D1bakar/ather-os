name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTC_BOOTSTRAP: 1

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy, rust-src

      - name: Add cross targets
        run: rustup target add x86_64-unknown-none x86_64-unknown-uefi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy --workspace --exclude aether-boot --all-targets -- -D warnings
          cargo clippy -p aether-boot --target x86_64-unknown-uefi -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build workspace
        run: cargo build --workspace

      - name: Build UEFI boot loader
        run: cargo build -p aether-boot --target x86_64-unknown-uefi --release

      - name: Build bare-metal kernel
        run: |
          cargo build -p aether-kernel --no-default-features --features bare-metal \
            --target x86_64-unknown-none --release \
            -Z build-std=core,compiler_builtins \
            -Z build-std-features=compiler-builtins-mem

  qemu-boot:
    name: QEMU Boot Smoke (optional)
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rust-src

      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf

      - name: Build boot artifacts
        run: bash scripts/build-boot.sh

      - name: Run QEMU smoke test
        run: bash scripts/run-qemu.sh
