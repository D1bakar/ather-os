name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pages-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pages-

      - name: Build boot artifacts
        run: pwsh -ExecutionPolicy Bypass -File scripts/build-boot.ps1
        env:
          RUSTC_BOOTSTRAP: 1

      - name: Install OVMF and QEMU
        run: sudo apt-get update && sudo apt-get install -y ovmf qemu-system-x86

      - name: Build web manifest and copy artifacts
        run: pwsh -ExecutionPolicy Bypass -File scripts/build-web-artifacts.ps1

      - name: Capture reference serial log (host QEMU smoke)
        run: |
          TIMEOUT=60 bash scripts/run-qemu.sh || true
          if [ -f build/qemu-serial.log ]; then
            cp build/qemu-serial.log web/public/artifacts/reference-serial.log
            echo "Reference serial log captured ($(wc -l < build/qemu-serial.log) lines)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
