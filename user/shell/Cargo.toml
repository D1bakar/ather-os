[package]
name = "aether-shell"
description = "Minimal Aether OS shell (echo, help)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["host"]
host = ["aether-rt/host"]
bare-metal = ["aether-rt/bare-metal"]

[dependencies]
aether-rt = { path = "../../libs/aether-rt", default-features = false }

[[bin]]
name = "shell"
path = "src/main.rs"
