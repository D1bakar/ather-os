[package]
name = "aether-kernel"
description = "Aether OS kernel (M5: capability enforcement and syscall validation)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["host-stub"]
# M0: compile and test on the host CI runner.
host-stub = ["aether-types/std"]
# M1: build with --no-default-features --features bare-metal
bare-metal = []

[lib]

[[bin]]
name = "kernel"
path = "src/main.rs"
required-features = ["bare-metal"]
test = false
doc = false

[dependencies]
aether-types = { workspace = true, default-features = false }
aether-abi = { workspace = true, default-features = false }

[dev-dependencies]
