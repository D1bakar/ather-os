[package]
name = "aether-kernel"
description = "Aether OS kernel (M2–M8 host-testable scaffolds)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[features]
default = ["host-stub"]
host-stub = ["aether-types/std"]
bare-metal = []

[lib]

[[bin]]
name = "kernel"
path = "src/main.rs"
required-features = ["bare-metal"]
test = false
doc = false

[dependencies]
aether-types = { workspace = true, default-features = false }
aether-abi = { workspace = true, default-features = false }
aether-io = { workspace = true, default-features = false }
aether-sync = { workspace = true, default-features = false }
aether-collections = { workspace = true, default-features = false }
aether-drv-hal = { workspace = true }
aether-drv-serial = { workspace = true }
aether-drv-keyboard = { workspace = true }
aether-drv-framebuffer = { workspace = true }
aether-drv-storage = { workspace = true }
aether-drv-net = { workspace = true }
x86_64 = { workspace = true, default-features = false, features = ["instructions"] }

[dev-dependencies]
