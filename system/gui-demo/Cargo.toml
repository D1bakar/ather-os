[package]
name = "aether-gui-demo"
description = "Host-side Aether OS GUI foundation demo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "aether-compositor-demo"
path = "src/main.rs"

[dependencies]
aether-compositor = { path = "../compositor", features = ["std"] }
aether-desktop = { path = "../desktop", features = ["std"] }
aether-terminal = { path = "../terminal", features = ["std"] }
aether-gui-ipc = { path = "../gui-ipc", features = ["std"] }
aether-window = { path = "../window", features = ["std"] }
embedded-graphics = { version = "0.8", default-features = false }
