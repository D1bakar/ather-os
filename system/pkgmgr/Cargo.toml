[package]
name = "aether-pkgmgr"
description = "Package manager library for Aether OS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = ["serde/std"]
# Real ed25519 verification (host tooling); default build uses the stub verifier.
verify = ["dep:ed25519-dalek", "dep:sha2"]

[dependencies]
aether-types = { workspace = true, default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
ed25519-dalek = { version = "2", optional = true, default-features = false, features = ["std"] }
sha2 = { version = "0.10", optional = true, default-features = false }

[dev-dependencies]
